services:
  - type: web
    name: opd-backend
    env: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: MONGO_URL
        sync: false
      - key: DATABASE_NAME
        value: clinic_db